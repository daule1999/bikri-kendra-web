name: Deploy

# The ONLY way to deploy. Manual run: Actions → Deploy → Run workflow.
#   UAT (qa)    → any branch or any tag
#   production  → a release tag vMAJOR.MINOR.PATCH only
# All configuration comes from the GitHub *Environment* of the same name (qa / production).
# Each value is read from a secret first, then falls back to a variable of the same name.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target instance
        type: choice
        options: [qa, production]
        default: qa
      ref:
        description: Branch or tag to deploy (production requires a vX.Y.Z tag)
        required: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # holds the secrets/variables below; add required reviewers on 'production'
    env:
      TARGET: ${{ inputs.environment }}
      REF: ${{ inputs.ref }}
    steps:
      - name: Check required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN || vars.DEPLOY_DOMAIN }}
          BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEPLOY_DOMAIN BACKEND_URL SESSION_SECRET; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then echo "::error::Missing in environment '$TARGET' (as secret or variable):$missing"; exit 1; fi

      - name: Validate ref for target
        run: |
          if [ "$TARGET" = production ] && ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production deploys only from a release tag like v1.2.0 (got '$REF')"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0          # tags needed for version labels

      - name: Production ref must really be a tag
        if: inputs.environment == 'production'
        run: git show-ref --verify --quiet "refs/tags/$REF" || { echo "::error::'$REF' is not a tag"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # BUILD ONCE: the build has no environment-specific values, so the exact same out/ is
      # reused for QA and production of the same commit (the Worker injects the runtime config).
      - name: Restore build for this commit
        id: build-cache
        uses: actions/cache@v4
        with:
          path: out
          key: site-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      - name: Build (only if not cached)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Deploy
        env:
          CI_DEPLOY: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN || vars.DEPLOY_DOMAIN }}
          GITHUB_REF_NAME: ${{ inputs.ref }}
          # runtime flags → Worker vars (injected into pages at request time)
          ENCRYPT_API: ${{ vars.ENCRYPT_API || secrets.ENCRYPT_API }}
          ENABLE_LOGS: ${{ vars.ENABLE_LOGS || secrets.ENABLE_LOGS }}
        run: scripts/deploy.sh "$TARGET"

      # Secrets are set AFTER deploy (a plain var of the same name must be gone first) and are idempotent.
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL }}
          API_ENCRYPTION_KEY: ${{ secrets.API_ENCRYPTION_KEY || vars.API_ENCRYPTION_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
        run: |
          printf '%s' "$BACKEND_URL" | npx wrangler secret put BACKEND_URL --env "$TARGET"
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --env "$TARGET"
          if [ -n "$API_ENCRYPTION_KEY" ]; then
            printf '%s' "$API_ENCRYPTION_KEY" | npx wrangler secret put API_ENCRYPTION_KEY --env "$TARGET"
          fi

      - name: Smoke test
        env:
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN || vars.DEPLOY_DOMAIN }}
        run: |
          sleep 10
          curl -fsS "https://$DEPLOY_DOMAIN/api/health" | tee /dev/stderr | grep -q '"backendConfigured":true'
